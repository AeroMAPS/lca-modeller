[project]
name = "lca-modeller"
version = "0.1.4-beta"
description = "Python library to build parametric LCA models from a configuration file."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "GPL-3.0-only" }

authors = [
    { name = "Félix POLLET", email = "felix.pollet@isae-supaero.fr" },
    { name = "Scott DELBECQ", email = "scott.delbecq@isae-supaero.fr" },
    { name = "Thomas PLANES", email = "thomas.planes@isae-supaero.fr" },
]

keywords = [
    "life cycle assessment",
    "LCA",
    "parametric model",
    "prospective LCA",
]

dependencies = [
    "lca-algebraic-bw25>=1.4.1,<2",
    "premise>=2.5.2,<3",
    "jupyterlab",
    "ruamel.yaml>=0.15,<0.19",
    "ensure>=1.0.0,<2",
    "eight>=1.0.1,<2",
    "matplotlib>=3.7,<4",
    "pyvis>=0.3.0,<0.4",
]

[tool.uv]
required-environments = [
    "sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
    "sys_platform == 'win32' and platform_machine == 'AMD64'",
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
    "sys_platform == 'linux' and platform_machine == 'aarch64'",
]

constraint-dependencies = [
    # (from premise) llvmlite >=0.46 dropped Intel-macOS wheels
    "numba<0.63; sys_platform == 'darwin' and platform_machine == 'x86_64'",

    # (from premise) cryptography >=49 dropped Intel-macOS wheels
    "cryptography<49; sys_platform == 'darwin' and platform_machine == 'x86_64'",
]

[build-system]
requires = [
    "setuptools",
    "setuptools_scm[toml]",
]
build-backend = "setuptools.build_meta"

[tools.setuptools]

[tools.setuptools.packages.find]
where = ["."]
include = ["lca_modeller*"]

[tools.setuptools_scm]